[workspace]
resolver = "2"
members = [
    "chotu-common",
    "streamer",
    "janitor",
    "coordinator", "health-coach", "chotu-evals",
    "finance-advisor",
]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-native-tls", "sqlite", "chrono", "uuid", "macros", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "2.0"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio", "tokio"] }
native-tls = "0.2.18"
tokio-native-tls = "0.3.1"
reqwest = { version = "0.12", features = ["json"] }
notify = { version = "6.1.1", default-features = false, features = ["macos_fsevent"] }
csv = "1.3"
tokio-stream = "0.1"
futures = "0.3"
sha2 = "0.10"
tempfile = "3.10"
teloxide = { version = "0.12", features = ["macros"] }
mailparse = "0.15"
serde_yaml = "0.9"
rig-core = "0.37.0"
schemars = "1"
dotenvy = "0.15"



