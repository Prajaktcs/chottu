name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Reject edits to existing SQL migrations
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Modified (not newly added) migration files are forbidden, unless the
          # result exactly matches the file's first-committed content (one-time
          # restore after an accidental edit — sqlx checksums must stay stable).
          changed="$(git diff --name-only --diff-filter=M "${base}...${head}" -- 'chotu-common/migrations/*.sql' || true)"
          blocked=""
          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue
            intro="$(git log --diff-filter=A --format=%H "${head}" -- "${file}" | tail -1)"
            if [[ -z "${intro}" ]]; then
              blocked="${blocked}${file} (could not find introduction commit)"$'\n'
              continue
            fi
            if git diff --quiet "${intro}:${file}" "${head}:${file}"; then
              echo "Allowing restore of ${file} to its introduction commit (${intro})"
            else
              blocked="${blocked}${file}"$'\n'
            fi
          done <<< "${changed}"
          if [[ -n "${blocked}" ]]; then
            echo "::error::Do not modify already-committed migrations (sqlx checksums break). Add a new migration file instead."
            echo "${blocked}"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace

      - name: Run workspace tests
        run: cargo test --workspace --locked --all-targets
